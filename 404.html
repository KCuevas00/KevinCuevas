<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kevin Cuevas</title>
    <script>
        var path = window.location.pathname.toLowerCase();
        if (path === '/es' || path === '/es/' || path.indexOf('/es') === 0) {
            try {
                localStorage.setItem('preferredLanguage', 'es');
            } catch (e) {}
            window.location.replace('/?lang=es');
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
</body>
</html>
